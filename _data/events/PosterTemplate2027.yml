sponsorplan: |
    <p><b>Day of Data Jacksonville 2027</b> is Saturday, May 15, 2027, at the Davis College of Business &amp; Technology, Jacksonville University, with pre-cons on Friday, May 14. It's hosted by Jax Data, a 501(c)(3) nonprofit, so your sponsorship is tax-deductible.</p>
    <p>How many conferences can you name where hundreds of data professionals give up a Saturday to learn? Jacksonville was the third-largest SQL Saturday in the United States from 2017 to 2019, and from 2022 to 2026 we were the world's largest Day of Data. That's more than 5,200 registrations since 2017.</p>
    <p>We plan the day, so every attendee passes your table at least six times. Sponsor tables sit in the common middle, between classrooms and near registration and breakfast, with signs, schedule mentions, social posts, and the closing raffle all giving people another reason to find you.</p>
    <p>Check this out! Every attendee badge has a QR code. When you scan it, our system ties that attendee to your sponsorship. New for 2027, you can add a note to any scan: "Wants a demo in June." "Hiring a senior DBA." When your lead list shows up after the event, your notes are already on it.</p>
    <p>We also hand every attendee a sponsor bingo card. They fill it in by visiting sponsor tables, and a completed card gets them into the end-of-day raffle. That's one more reason to stop by your table.</p>
