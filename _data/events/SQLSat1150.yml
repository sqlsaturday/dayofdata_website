precondetail: |
    <p>Pre-Cons will be held on Friday October 2nd.</p>
    <p><a href="https://www.eventbrite.com/e/boston-data-and-ai-saturday-2026-tickets-1987157502583"><h1>Adding PostgreSQL To Your SQL Server Skill Set - Grant Fritchey and Taiob Ali</h1></a><br>
    <a href="https://www.eventbrite.com/e/boston-data-and-ai-saturday-2026-tickets-1987157502583"><h3>Click Here To Register - https://www.eventbrite.com/e/boston-data-and-ai-saturday-2026-tickets-1987157502583</h3></a>
    </p>
    <h3>Session Details:</h3>
    <p>Organizations are adopting PostgreSQL faster than they're retiring SQL Server. If you manage both now, or soon will, this all-day class cuts the learning curve by showing you exactly where the platforms align and where they diverge.</p>
    <p>You'll learn PostgreSQL fundamentals through a SQL Server lens: architecture, queries, administration, tooling, and cloud deployment. Apply your existing expertise immediately instead of starting over.</p>
    <p><b>Who should attend:</b> DBAs, architects, and developers managing SQL Server who are now responsible for PostgreSQL in hybrid environments, cloud adoption, or modernization projects.</p>
        
    <h3>Speaker:</h3>
    <p><b>Grant Fritchey</b> is a Data Platform MVP and AWS Community Builder with over 30 years’ experience in IT, including time spent in support and development. Grant works with multiple data platforms including SQL Server and PostgreSQL as well as multiple cloud platforms. He has also developed in VB, VB.NET, C#, and Java. Grant writes books for Apress and Simple-Talk. Grant presents at conferences and user groups, large and small, all over the world. He joined Redgate Software as a product advocate in January 2011.</p>
    
    <p><b>Taiob Ali</b> is a Microsoft Data Platform MVP with 20+ years of experience with SQL Server and Azure data services. While SQL Server remains his primary focus, he is currently learning, using, and teaching PostgreSQL, often describing himself as an accidental PostgreSQL DBA.
    He is also exploring practical applications of AI in data platforms, including GitHub Copilot, Copilot agent development, and built‑in AI capabilities in SQL Server. Taiob is a frequent international speaker and an active community organizer.</p>
    
    <br>

    <p><a href="https://www.eventbrite.com/e/boston-data-and-ai-saturday-2026-tickets-1987157502583"><h1>Building Reliable AI Apps and Agents with Azure SQL Database - David Pless and Abdullah Mamun</h1></a><br>
    <a href="https://www.eventbrite.com/e/boston-data-and-ai-saturday-2026-tickets-1987157502583"><h3>Click Here To Register - https://www.eventbrite.com/e/boston-data-and-ai-saturday-2026-tickets-1987157502583</h3></a>
    </p>
    <h3>Session Details:</h3>
    <p>Learn how to build production-ready AI applications and agents powered by Azure SQL. In this hands-on session, you'll prepare Azure SQL Database as a resilient Retrieval-Augmented Generation (RAG) data source, implement hybrid search that combines vector and relational retrieval techniques, and integrate your retrieval layer with applications and AI agents.</p>
    <p>Through guided labs and real-world scenarios, you'll explore core patterns for semantic search, vector search, hybrid retrieval, embeddings, and agent-driven application design using Azure SQL Database as the implementation platform. You'll also learn how these same architectural patterns align with the broader Microsoft SQL portfolio, including the AI capabilities introduced in SQL Server 2025 such as vector search, embeddings, hybrid search, and agentic application development.</p>
    <p>Leave with practical patterns, hands-on experience, and an understanding you can apply immediately to build reliable, scalable and secure AI solutions using your existing data, whether your future deployments run in Azure SQL Database, SQL Server 2025, or hybrid environments.</p>
        
    <h3>Speaker:</h3>
    <p><b>Abdullah Mamun, Program Manager at Microsoft SQL Server</b> Abdullah Mamun is a program manager at Microsoft with a deep expertise in the SQL Server engine space. With more than 20 years of experience in the field, Mamun has established himself as a leading authority on SQL Server features and troubleshooting. In his role at Microsoft, Mamun is responsible for overseeing the development of key SQL Server features and ensuring that they meet the needs of broad SQL Server customer base. Abdullah is also a well-respected speaker in the SQL Server community, having presented at numerous industry events such as Live 360, SQL Saturdays.</p>
    
    <p><b>Jerry Nixon, Principal Product Manager - Microsoft Corporation</b> Jerry Nixon is a SQL Server Principal Product Manager at Microsoft on the Azure Data Developer Experiences team, championing SQL MCP Server and practical architecture. With two decades of experience, Jerry is an engineer, a university Computer Science teacher, a speaker, and a database Product Manager. Over the years, he has trained thousands of developers. You’ll find him talking about design patterns, machine learning, and, of course, SQL Server.</p>
    
    <br>

