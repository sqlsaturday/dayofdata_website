description: |
  <p>Day of Data Winnipeg 2026 is a free, community-driven event for data professionals, technology enthusiasts, students, and lifelong learners. Hosted at the University of Manitoba, the event builds on the tradition of Winnipeg's successful SQL Saturday conferences while expanding to encompass the full spectrum of modern data technologies from SQL Server to PostgreSQL to Databricks and more.</p>
  
eventlocation: |
    University of Manitoba,<br/>
    Engineering and Information Technology Complex</br>
    75 Chancellors Circle, Winnipeg MB<br/>
    Registration, sponsors, and sessions will be held in rooms on the lower level.<br/>
    <img src="/assets/event/1159/EITC-lower-floor-plan.png" alt="EITC lower floor plan" style="max-width:100%; height:auto;">

parkingdesc: |
  <p>Saturday parking on the Fort Garry campus is generally free in surface lots. The University Parkade is an exception and remains paid. Please follow any event-specific parking signage that may be in effect.</p>
  <p>Recommended parking areas include:</p>
  <ul>
    <li>Lot U (near IG Field)</li>
    <li>Lot Q (Dysart Road)</li>
    <li>Lot L</li>
    <li>SD East / SD West lots</li>
  </ul>
  <p>All of these lots are within a reasonable walk of Engineering.</p>

