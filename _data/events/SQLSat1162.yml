precondetail: |
  <h2>Postgres in a Day</h2>
  <p>If you've recently decided to start learning PostgreSQL, or, if you've recently been told you better start learning PostgreSQL, then this session is for you. Full day of learning Postgres from Pat Wright and Grant Fritchey.</p>
  <p><a href="https://www.eventbrite.com/e/postgresql-in-a-day-tickets-2001398750539?aff=oddtdtcreator">Register for Postgres in a Day</a></p>
  <h2>Building Reliable AI Apps and Agents with Microsoft</h2>
  <p>Learn how to build production-ready AI applications and agents powered by Azure SQL. In this hands-on workshop, you'll prepare Azure SQL Database as a resilient Retrieval-Augmented Generation (RAG) data source, implement hybrid search that combines vector and relational retrieval techniques, and integrate your retrieval layer with applications and AI agents.</p>
  <p><a href="https://www.eventbrite.com/e/building-reliable-ai-apps-and-agents-with-microsoft-sql-tickets-1997803305466">Register for Building Reliable AI Apps and Agents with Microsoft</a></p>

