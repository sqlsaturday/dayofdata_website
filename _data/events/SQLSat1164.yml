sponsorplan: |
  <h1><a name="sponsorship">Sponsorship Plan</a></h1>
  <p>Sponsors and community partners are recognized on the Day of Data Detroit event page and during the event.</p>
  <p>Sponsors help support free technical education, speaker support, attendee food and beverages, event materials, and community engagement for Day of Data Detroit 2026.</p>
  <p>Organizations working with SQL Server, Azure SQL, Microsoft Fabric, Power BI, Azure Data &amp; AI, Databricks, streaming, data engineering, analytics, AI, cloud, governance, security, developer tools, recruiting, and related technologies are especially encouraged to participate.</p>
  <h2>Sponsorship Levels</h2>
  <p>We welcome both financial and in-kind sponsorship support.</p>
  <h2>In-Kind Sponsorship</h2>
  <ul>
    <li><strong>Lunch / Food Support</strong> - attendee lunch, catering credit, restaurant or grocery gift cards.</li>
    <li><strong>Coffee, Water, and Snacks</strong> - beverages and refreshments.</li>
    <li><strong>Speaker Support</strong> - speaker gifts or other speaker-related expenses.</li>
    <li><strong>Raffle / Giveaway Support</strong> - books, software, training, gift cards, or attendee prizes.</li>
  </ul>
  <h2>Nonprofit Sponsorship Processing</h2>
  <p>SQL Saturday Corporation is a U.S. 501(c)(3) nonprofit organization. If your organization requires a nonprofit invoice or sponsorship receipt, contact the organizer so sponsorship processing through SQL Saturday Corporation can be coordinated.</p>
  <p>For sponsorship opportunities, please email <a href="mailto:mouraksh@umich.edu">Mou Rakshit</a>.</p>