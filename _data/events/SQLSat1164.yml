parkingdesc: |
  <strong>Important for Saturday, September 12:</strong> This is a University of Michigan home-football Saturday. Ann Arbor District Library has advised that downtown traffic will be very heavy and parking may be scarce or more expensive than normal. The Downtown Library does not have public parking and does not validate parking. The underground Library Lane structure next to the Library is city-managed, not operated by AADL.<br/><br/>
  <strong>If you drive:</strong> Arrive early and use an official City/DDA public parking structure rather than relying on curbside parking. The Ann Arbor DDA currently lists public parking structures at $1.80/hour Monday-Saturday and metered parking at $2.60/hour, enforced Monday-Saturday from 8:00 AM-6:00 PM. Special-event rates may apply, so check current rates and posted signs before parking. <a href="https://www.a2dda.org/parking-rates/" target="_blank" rel="noopener noreferrer">Check Ann Arbor DDA parking rates and parking information</a>.<br/><br/>
  <strong>Football game-day restrictions:</strong> The City of Ann Arbor lists September 12 as a U-M home football game day. Designated stadium-area on-street parking restrictions are in effect from 8:00 AM-midnight, with additional road closures around Michigan Stadium. Follow posted signs carefully and allow extra travel time. <a href="https://www.a2gov.org/police-department/game-day-in-ann-arbor/" target="_blank" rel="noopener noreferrer">Review City game-day traffic and parking restrictions</a>.<br/><br/>
  <strong>Transit / Park & Ride:</strong> AADL specifically recommends checking AAATA/TheRide for bus and park-and-ride options. During the 2026 Fourth Avenue construction project, the Blake Transit Center is temporarily closed and downtown bus boarding has moved to Fifth Avenue and Washington Street near the Library. <a href="https://www.theride.org/park-ride-locations" target="_blank" rel="noopener noreferrer">View TheRide Park & Ride locations</a> and use TheRide's current trip-planning tools before traveling.<br/><br/>
  <strong>Parking questions:</strong> AADL recommended contacting the downtown parking administrator at (734) 761-7235 or <a href="mailto:a2parkingadmin@municipalparking.com">a2parkingadmin@municipalparking.com</a>. For TheRide route assistance, call 734-996-0400.
