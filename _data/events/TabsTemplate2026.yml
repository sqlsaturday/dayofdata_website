preconintro: "Pre-Cons will be held on Friday May 1st."
preconname1: "Advanced T-SQL Triage: The Art of Fixing Terrible Code"
preconspeaker1: "Erik Darling"
precondescription1: |
    <p>You’ve seen it before: the procedure that looks like it was generated by an AI trained on Stack Overflow and despair. It’s got MERGE. It’s got RIGHT JOINs. It’s got logic so tangled you’d need a flowchart, a flashlight, and a therapist to debug it. And now… it’s your problem.</p>
    <p>In this full-day festival of query-fixing, Erik Darling leads you through the real world mysteries of advanced T-SQL: the strange, the slow, and the occasionally cursed. You’ll tackle tangled paging logic, rescue window functions and indexed views from spools and spills, and finally learn when to keep a CTE and when to yeet it. We’ll refactor data modifications that block like linebackers, decode procedural patterns, and write dynamic SQL that’s powerful and polite.</p>
    <p>You’ll learn when to CROSS APPLY, dig into views vs. inline TVFs, and discover why RIGHT JOIN is not simply LEFT JOIN’s syntactic twin. We’ll uncover when user-defined functions wreck your query execution plans—and how to rewrite them with flair. If you’ve ever been curious about why that query sometimes takes SO long and how to best rewrite it without just guessing, this is your playground.</p>
    <p>Expect fast demos, big laughs, and a glorious cheat sheet to take home. Because refactoring SQL isn’t just necessary—it’s super fun when you're in the right party.</p>
preconregurl1: https://bit.ly/dayofdataprecon2026-1
preconname2: "Creating a modern data environment in Microsoft Fabric"
preconspeaker2: "Ginger Grant, Belinda Allen"
precondescription2: |
    <p>This workshop will provide participants with the knowledge and tools needed to create an enterprise-ready Microsoft Fabric datastore from scratch using either SQL DB, Lakehouse, or Warehouse. The workshop covers everything from getting started, gathering data from different sources, transforming the data into an analytical model, securing access, and monitoring its performance. As Fabric provides many methods for performing these tasks, we will cover a variety of development tools, including shortcuts, copying data, pipelines, Data Flow Gen 2, and notebooks, and explain which is the best choice in a given situation.</p>
    <p>Participants will practice the steps through hands-on exercises using medallion architecture to transform data into an analytical lakehouse or warehouse, which can be used for ad hoc querying and, of course, as a source for Power BI reports. Participants will learn how to provide ongoing maintenance, security, and monitoring of the processes to ensure it is an enterprise-level solution. The workshop experience and examples will provide participants with the knowledge needed to implement the techniques to create their own lakehouse and warehouse. We will also review security and DevOps with Fabric.</p>
    <p>By the end of the session, participants will not only understand the technical steps involved but also when and which data architecture to choose for their organizational data needs.</p>
preconregurl2: https://bit.ly/dayofdataprecon2026-2
