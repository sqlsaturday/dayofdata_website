    <h2>Contact Us</h2>
    <p>We hope you'll support this event! Please contact us at <a href="mailto:jeff@jefftaylor.io">jeff@jefftaylor.io</a> if you have any questions.</p>

    <h2>Additional Information</h2>
    <p>Day of Data Jacksonville 2027 is produced by and for the community of SQL developers, administrators, and affiliated disciplines. Event Sponsorship doesn't entail oversight or selection of topics or content.</p>
    <p>Credit card payments can be made online by using Zeffy so we aren't charged fees. Contact us for the 2027 payment link. On the Zeffy website you don't need to pay for any additional fees. <mark>All funds must arrive two months (March 15, 2027) before the event to be included on printed material.</mark></p>
    <p>While Day of Data Jacksonville requires funds to operate, Sponsorship is also accepted as 'in-kind' contributions where the goods or services provided are those needed for Day of Data. We're especially interested in community groups helping plan and publicize the event. Don't hesitate to get in touch with us if you have any questions about how you can help.</p>
    <p>About 'in-kind' Sponsorships: We distinguish between Sponsors that provide 'cash', and those that supply 'in-kind' Products and Services for raffles or other use. Our reasoning is thus:<br>
    <ul>
      <li>A 'cash' Sponsor provides the raw resource needed to produce Day of Data. In addition, it pays for equipment rental, shirts, lanyards, advertising, refreshments, and meals. Therefore, that sponsor earns significant brand recognition and exposure benefits, as outlined in the Sponsorship 'level' document (Platinum, Gold, Silver, Bronze, etc.)</li>
      <li>An 'in-kind' sponsor provides an optional resource that we can do without if need be. Also, that optional resource often serves to provide brand recognition and exposure. At past events, some Sponsors have sponsored both at a cash level that was practical for them AND provided branded items to maximize their brand exposure. Those Sponsors then received both sets of benefits as outlined above.</li>
    </ul>
    <h2>Logistics</h2>
    <p>We'll open the doors to sponsors at 7:30 am. Sponsors will be provided with a table, two chairs, and limited access to 110v power (please let us know what you need in advance). Tables will be in the same area as registration and breakfast to make it easy for attendees to stop by your table. We encourage sponsors to remain on site through the end of the day and have a representative present to present your prize and collect all raffle tickets for use later.</p>
    <p>Lunch will be provided to sponsors that have registered. So please have everyone from your team attending register at <a href="https://www.dayofdata.org/jax">https://www.dayofdata.org/jax</a> so that we can have enough food available.</p>
    <h2>Important Deadlines</h2>
    <p>Sponsorship payments must be received in full no later than <b><mark>March 15, 2027</mark></b> to guarantee inclusion in print and display materials. All sponsor-supplied materials must be received by May 3, 2027. (Don't send anything to arrive before April 26th as we don't have the storage facility any earlier) Contact us for applicable shipping addresses.</p>
    <h2>The Raffle - Your Key to Success</h2>
    <p>The biggest challenge with community events is capturing contact information for follow-ups. Few attendees will have business cards, and having them handwrite their info often leads to a 30% or higher loss due to the inability to read what they wrote! Instead, we provide attendees with a pre-printed badge with a QR code. This code can be scanned and associated with you as the sponsor in our backend system. This gives you 100% readability and 0% loss! It's also more effective than any other technique for capturing contact information. After the event, depending on your sponsorship level, we will provide you with your scanned list.</p>
    <p>Here are the instructions to scan attendees' badges at our event: <a href="https://www.youtube.com/watch?v=zvsJtXrgIoc">https://www.youtube.com/watch?v=zvsJtXrgIoc</a></p>
    <p>Here is a picture of our badge.</p>
    <p><img src="/assets/img/events/jax/BadgePicture.jpg" alt="sample name badge"></p>
    <p>Because we want you to be successful, all our sponsorship levels include the requirement that you provide a prize of at least $100 in value and a full-color 8-1/2 x 11 flyer highlighting the prize(s) you're providing for the raffle.</p>
    <p>We will have one table for all absentee vendors in the same areas as our onsite vendors. Raffle ticket collection will proceed through the end of the day. If someone from your team is present, we'll ask them to draw the winning ticket. Otherwise, we'll select the ticket. Attendees must be present to win. If there is a physical prize, we'll give it to them. Otherwise, we'll forward their contact information for you to follow up with (for license keys, etc.)</p>
    <h2>Contact Us</h2>
    <P>We hope you'll support this event! Don't hesitate to contact us at <a href="mailto:Jeff@JeffTaylor.io">Jeff@JeffTaylor.io</a> if you have any questions.</p>

