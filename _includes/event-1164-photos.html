  <div class="dod-detroit-photo-grid">
    <figure class="dod-detroit-photo">

      </a>
      <figcaption>Technical session and attendees</figcaption>
    </figure>
    <figure class="dod-detroit-photo">
      <a href="/assets/event/1164/photos/detroit-2026-02-attendees-demo.jpg" data-photo-index="1" aria-label="View event photo 2: Attendees following a live demo">
        <img src="/assets/event/1164/photos/detroit-2026-02-attendees-demo.jpg" alt="Wide view of attendees following a live technical demonstration" loading="eager" decoding="async" width="1280" height="960">
      </a>
      <figcaption>Attendees following a live demo</figcaption>
    </figure>
    <figure class="dod-detroit-photo">
      <a href="/assets/event/1164/photos/detroit-2026-03-genie-presentation.jpg" data-photo-index="2" aria-label="View event photo 3: Databricks Genie presentation">
        <img src="/assets/event/1164/photos/detroit-2026-03-genie-presentation.jpg" alt="Mou Rakshit presenting an Azure Databricks demonstration to attendees" loading="eager" decoding="async" width="1280" height="960">
      </a>
      <figcaption>Databricks Genie presentation</figcaption>
    </figure>
    <figure class="dod-detroit-photo">
      <a href="/assets/event/1164/photos/detroit-2026-04-speaker-session.jpg" data-photo-index="3" aria-label="View event photo 4: Another technical session">
        <img src="/assets/event/1164/photos/detroit-2026-04-speaker-session.jpg" alt="Technical speaker at the front of the Day of Data Detroit classroom" loading="lazy" decoding="async" width="1280" height="960">

      <figcaption>Another technical session</figcaption>
    </figure>
    <figure class="dod-detroit-photo">
      <a href="/assets/event/1164/photos/detroit-2026-05-attendee-group.jpg" data-photo-index="4" aria-label="View event photo 5: Community and attendees">
        <img src="/assets/event/1164/photos/detroit-2026-05-attendee-group.jpg" alt="Mou Rakshit and attendees at Day of Data Detroit 2026" loading="lazy" decoding="async" width="1280" height="960">

      <a href="/assets/event/1164/photos/detroit-2026-06-networking.jpg" data-photo-index="5" aria-label="View event photo 6: Community networking">
        <img src="/assets/event/1164/photos/detroit-2026-06-networking.jpg" alt="Participants networking and sharing lunch during the event" loading="lazy" decoding="async" width="1280" height="960">

      <figcaption>Community networking</figcaption>
    </figure>
  </div>
  <div class="dod-detroit-lightbox" role="dialog" aria-modal="true" aria-label="Day of Data Detroit photo slideshow" hidden tabindex="-1">
    <button type="button" class="dod-lightbox-close" aria-label="Close slideshow">&times;</button>
    <button type="button" class="dod-lightbox-arrow dod-lightbox-prev" aria-label="Previous photo">&#10094;</button>
    <div class="dod-lightbox-main">
      <img alt="" class="dod-lightbox-image">
      <p class="dod-lightbox-caption" aria-live="polite"></p>
      <p class="dod-lightbox-counter" aria-live="polite"></p>
    </div>
    <button type="button" class="dod-lightbox-arrow dod-lightbox-next" aria-label="Next photo">&#10095;</button>
  </div>
</section>
<style>
.dod-detroit-gallery{margin:1.5rem auto 2.5rem;text-align:center}
.dod-detroit-gallery h2{margin-bottom:.5rem}
.dod-gallery-intro{max-width:850px;margin:0 auto 1.25rem}
.dod-detroit-photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:18px auto;max-width:1100px}
.dod-detroit-photo{margin:0;min-width:0}
.dod-detroit-photo a{display:block;overflow:hidden;border-radius:8px;outline-offset:4px}
.dod-detroit-photo img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:contain;background:#f5f5f5;border-radius:8px}
.dod-detroit-photo figcaption{font-size:.95rem;margin-top:8px}
.dod-detroit-photo a:focus-visible{outline:3px solid #2c65ae}
.dod-detroit-lightbox[hidden]{display:none!important}
.dod-detroit-lightbox{position:fixed;z-index:99999;inset:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:46px 16px 25px;background:rgba(10,14,22,.96);color:#fff}
.dod-lightbox-main{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;flex:1;height:100%}
.dod-lightbox-image{max-height:75vh;max-width:100%;width:auto;height:auto;object-fit:contain;border-radius:4px}
.dod-lightbox-caption,.dod-lightbox-counter{margin:10px 0 0;color:#fff}
.dod-lightbox-counter{font-size:.85rem;color:#d7dce4}
.dod-lightbox-close,.dod-lightbox-arrow{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.45);color:#fff;cursor:pointer;border-radius:8px}
.dod-lightbox-close{position:absolute;top:12px;right:16px;width:42px;height:42px;font-size:30px;line-height:1}
.dod-lightbox-arrow{flex:0 0 42px;height:56px;font-size:28px}
.dod-lightbox-close:focus-visible,.dod-lightbox-arrow:focus-visible{outline:3px solid #e2edff;outline-offset:3px}
@media(max-width:750px){.dod-detroit-photo-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.dod-detroit-lightbox{padding:52px 6px 20px;gap:4px}.dod-lightbox-arrow{flex-basis:32px;height:50px;font-size:23px}}
@media(max-width:440px){.dod-detroit-photo-grid{grid-template-columns:1fr}.dod-lightbox-image{max-height:65vh}}
</style>
<script>
(function(){
  "use strict";
  var root=document.getElementById("event-photos");
  if(!root || root.dataset.slideshowReady) return;
  root.dataset.slideshowReady="true";
  var photos=[{"src":"/assets/event/1164/photos/detroit-2026-01-full-session.jpg","alt":"Attendees during a full-room technical session at Day of Data Detroit 2026","caption":"Technical session and attendees"},{"src":"/assets/event/1164/photos/detroit-2026-02-attendees-demo.jpg","alt":"Wide view of attendees following a live technical demonstration","caption":"Attendees following a live demo"},{"src":"/assets/event/1164/photos/detroit-2026-03-genie-presentation.jpg","alt":"Mou Rakshit presenting an Azure Databricks demonstration to attendees","caption":"Databricks Genie presentation"},{"src":"/assets/event/1164/photos/detroit-2026-04-speaker-session.jpg","alt":"Technical speaker at the front of the Day of Data Detroit classroom","caption":"Another technical session"},{"src":"/assets/event/1164/photos/detroit-2026-05-attendee-group.jpg","alt":"Mou Rakshit and attendees at Day of Data Detroit 2026","caption":"Community and attendees"},{"src":"/assets/event/1164/photos/detroit-2026-06-networking.jpg","alt":"Participants networking and sharing lunch during the event","caption":"Community networking"}];
  var dialog=root.querySelector(".dod-detroit-lightbox");
  var viewer=dialog.querySelector(".dod-lightbox-image");
  var caption=dialog.querySelector(".dod-lightbox-caption");
  var counter=dialog.querySelector(".dod-lightbox-counter");
  var closeButton=dialog.querySelector(".dod-lightbox-close");
  var lastFocused=null;
  var active=0;
  function render(i){
    active=(i+photos.length)%photos.length;
    viewer.src=photos[active].src;
    viewer.alt=photos[active].alt;
    caption.textContent=photos[active].caption;
    counter.textContent=(active+1)+" of "+photos.length;
  }
  function open(i){
    lastFocused=document.activeElement;
    render(i);
    dialog.hidden=false;
    document.body.style.overflow="hidden";
    closeButton.focus();
  }
  function close(){
    dialog.hidden=true;
    document.body.style.overflow="";
    viewer.removeAttribute("src");
    if(lastFocused && lastFocused.focus) lastFocused.focus();
  }
  root.querySelectorAll("[data-photo-index]").forEach(function(a){
    a.addEventListener("click",function(event){event.preventDefault();open(Number(a.dataset.photoIndex));});
  });
  closeButton.addEventListener("click",close);
  dialog.querySelector(".dod-lightbox-prev").addEventListener("click",function(){render(active-1);});
  dialog.querySelector(".dod-lightbox-next").addEventListener("click",function(){render(active+1);});
  dialog.addEventListener("click",function(event){if(event.target===dialog)close();});
  document.addEventListener("keydown",function(event){
    if(dialog.hidden)return;
    if(event.key==="Escape"){event.preventDefault();close();}
    else if(event.key==="ArrowLeft"){event.preventDefault();render(active-1);}
    else if(event.key==="ArrowRight"){event.preventDefault();render(active+1);}
  });
  var swipeX=null;
  viewer.addEventListener("touchstart",function(e){swipeX=e.changedTouches[0].screenX;},{passive:true});
  viewer.addEventListener("touchend",function(e){
    if(swipeX===null)return;
    var delta=e.changedTouches[0].screenX-swipeX;
    if(Math.abs(delta)>55)render(active+(delta<0?1:-1));
    swipeX=null;
  },{passive:true});
})();
</script>
